<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Recommendation Engine</title>
      <link rel="stylesheet" href="style.css"> 
</head>  
<body>
<!--heading-->
    <header>
        <div class="title-bar">
            <img src="download1.png">
    <h1>Movie Recommendation Engine </h1> 
    </div>
     <h2>Discover your next favourite movie</h2>
    </header>

    <!--search section-->
    <div class="search">
      <input type="text" id="searchinput" placeholder="Enter movie name / actor / mood" class="searchbox">
      <button class="searchbutton">search</button>
    </div>

    <!--movie details-->
<div id="movieResults" class="movieresults"></div>

<div id="movieDetails" class="moviedetails"></div>
<!--movie detail modal-->
<div id="movieModal" class="modal">
  <div class="modal-content" id="modalContent"></div>
</div>

<div class="box">   
  <h3 class="suggest">Find a movie that matches your mood/vibes</h3>
  </div>
